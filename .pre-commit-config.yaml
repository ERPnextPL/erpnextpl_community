exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "erpnextpl.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                erpnextpl/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                erpnextpl/templates/includes/.*|
                erpnextpl/public/js/lib/.*
            )$


  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: node
        entry: eslint
        types_or: [javascript]
        args: ['--quiet']
        additional_dependencies:
          - 'eslint@^9.0.0'
          - '@eslint/js@^9.0.0'
          - 'globals@^15.0.0'
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                eslint\.config\.js|
                erpnextpl/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                erpnextpl/templates/includes/.*|
                erpnextpl/public/js/lib/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: [eslint]
    submodules: false
